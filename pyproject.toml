[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "review-ticket"
version = "0.1.0"
description = "Manual peer-review workflow from a Jira issue through GitHub feedback and virtualization testing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
review-ticket = "review_ticket.cli:main"

[tool.setuptools.packages.find]
include = ["review_ticket*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
